include /etc/nginx/modules-enabled/*.conf;
worker_processes 1;
error_log /dev/stderr;
events {}

stream {
    upstream basedatos {
        server 192.168.20.4:3306 max_fails=1 fail_timeout=5s;
        server 192.168.20.5:3306 backup;
    }
    server {
        listen 3306;
        proxy_pass basedatos;
        proxy_connect_timeout 2s;
    }
}
