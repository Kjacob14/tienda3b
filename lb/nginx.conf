events {}

stream {
    upstream frontends {
        server 192.168.30.2:443 max_fails=2 fail_timeout=10s;
        server 192.168.30.3:443 max_fails=2 fail_timeout=10s;
    }
    server {
        listen 443;
        proxy_pass frontends;
        proxy_connect_timeout 3s;
    }
}

http {
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
