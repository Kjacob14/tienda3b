server {
    listen 80;
    server_name tienda.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tienda.lab;

    ssl_certificate     /etc/ssl/tienda/server.crt;
    ssl_certificate_key /etc/ssl/tienda/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
