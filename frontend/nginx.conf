server {
    listen 80;
    server_name tienda.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tienda.lab;

    ssl_certificate     /etc/ssl/tienda/server.crt;
    ssl_certificate_key /etc/ssl/tienda/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # TLS de frontend a backend: el cliente nunca habla con el backend
    location /api/ {
        proxy_pass https://192.168.20.2:3000;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
